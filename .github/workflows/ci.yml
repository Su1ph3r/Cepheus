name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref when a newer push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev + html for tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,html]"

      - name: Run pytest
        run: pytest -q --cov=cepheus --cov-report=term-missing

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ruff
        # Pin ruff to a known-good version so an upstream release that
        # adds new rules or changes formatter heuristics can't silently
        # turn the CI red. Bump deliberately, in lockstep with the
        # version pinned in .pre-commit-config.yaml so local hooks and
        # CI agree exactly. (ruff's formatter changes wrapping /
        # parenthesization rules across minor versions — e.g. 0.8 vs
        # 0.15 differ on assert+f-string layout.)
        run: pip install "ruff==0.15.14"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # Belt-and-braces: run the full pre-commit suite on every PR so the
  # mechanical sanity hooks (trailing-whitespace, EOF, merge-conflict
  # markers, large-file guard) trip CI if a contributor pushed without
  # running ``pre-commit install``. Same hooks, same pinned versions —
  # single source of truth in .pre-commit-config.yaml.
  pre-commit:
    name: pre-commit (commit-stage hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pre-commit
        run: pip install pre-commit
      # Skip the pytest hook here — pytest is already covered by the
      # ``test`` matrix job at full coverage; running it twice doubles
      # CI cost for zero added signal. Cheap hooks (ruff, whitespace,
      # yaml validation, merge-conflict guard) run every time.
      - name: Run pre-commit
        env:
          SKIP: pytest
        run: pre-commit run --all-files --show-diff-on-failure

  enumerator-shell-lint:
    name: enumerator (dash parse)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dash
        run: sudo apt-get update && sudo apt-get install -y dash

      - name: dash -n (POSIX parse-only)
        # The enumerator must be parseable by busybox sh / dash, which
        # several distroless and Alpine containers ship. The .gitattributes
        # in this repo enforces LF line endings to keep this gate honest
        # under Windows-host checkouts.
        # NOTE: shellcheck is intentionally NOT added here yet — adding it
        # in R2 alongside the planned enumerator expansion so we audit
        # findings in one pass instead of trickling them in.
        run: dash -n src/cepheus/enumerator/cepheus-enum.sh

  web-tests:
    name: web viewer (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: `node --test` glob-pattern support landed in Node 21.
          # On Node 20 the quoted glob matches nothing and the suite is a
          # silent no-op, so the gate must run on 21+.
          node-version: "22"

      - name: Run viewer unit tests
        # Zero-dependency: the viewer's pure helpers are unit-tested with
        # Node's built-in test runner — no package.json / node_modules.
        run: node --test "web/**/*.test.js"
