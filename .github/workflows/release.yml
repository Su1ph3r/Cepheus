name: release

# Drives the full release pipeline when a tag matching v*.*.* is pushed:
#
#   build              → sdist + wheel (the canonical Python artifacts)
#   binaries           → Nuitka-compiled single binaries for 5 platforms
#                        (linux amd64+arm64, darwin amd64+arm64, windows amd64)
#   container          → GHCR multi-arch image (linux/amd64 + linux/arm64),
#                        tagged :X.Y.Z, :X.Y, and :latest
#   attach-to-release  → uploads every artifact above to the GitHub Release
#                        (which `gh release create` must have created first)
#   publish-pypi       → twine upload to PyPI (skipped if SKIP_PYPI=true
#                        or PYPI_API_TOKEN unset — fails loud in latter)
#
# Ordering invariants:
#   * attach-to-release waits for build + binaries + container so all
#     artifacts land on the GH Release atomically.
#   * publish-pypi waits for attach-to-release so PyPI (irreversible —
#     no overwrites permitted) only publishes after the GH Release
#     assets are durable. The alternative ordering produces a split-brain
#     release on partial failure, with no recovery path except a version
#     bump.
#
# Setup before first use:
#   1. Create a PyPI project + API token (https://pypi.org/manage/account/token/)
#   2. Add it as a repo secret named PYPI_API_TOKEN at
#      Settings → Secrets and variables → Actions
#   3. Tag + push: git tag v0.4.1 && git push origin v0.4.1
#
# GHCR (ghcr.io/su1ph3r/cepheus) requires no extra secret — the workflow
# uses ${{ github.token }} with packages:write scope.
#
# Trusted-publishing alternative: if we set up OIDC trusted publishing on
# PyPI (https://docs.pypi.org/trusted-publishers/) we can drop the token
# entirely and use `pypa/gh-action-pypi-publish@release/v1` with id-token
# permissions. That's the recommended modern path; the token route is
# documented here as the fallback that always works.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.4.1)"
        required: true
        type: string

# Default to least-privilege at the workflow scope; each job widens to
# only what it needs. Prevents a compromised build step from minting
# OIDC tokens or pushing commits.
permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are needed so `python -m build` records the version
          # correctly (hatchling reads `[project].version` directly so
          # this is belt-and-braces).
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Capture metadata
        id: metadata
        env:
          # workflow_dispatch supplies the tag via input; push-tag uses GITHUB_REF.
          # Hoist the input through env so the bash script doesn't eat a
          # script-injection sink (same hardening pattern as the rest of this file).
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"

          # Resolve the tag from the trigger context. On push-tag, GITHUB_REF
          # is refs/tags/<tag>; on workflow_dispatch it is refs/heads/<branch>
          # and the operator supplies the tag via the `tag` input.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi

          if [ -z "${tag}" ]; then
            echo "::error::No tag resolved — neither refs/tags/<tag> nor workflow_dispatch input 'tag' supplied."
            exit 1
          fi

          # Validate tag shape even on dispatched runs (push-tag is already
          # constrained by the workflow's `tags:` filter).
          case "${tag}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Invalid tag '${tag}' — must match v<major>.<minor>.<patch>."
              exit 1
              ;;
          esac

          if [ "${tag#v}" != "${v}" ]; then
            echo "::error::Tag ${tag} doesn't match pyproject.toml version ${v}"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: List artifacts
        run: ls -la dist/

      - name: Upload artifacts (for later jobs)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binaries:
    name: build native binary (${{ matrix.label }})
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            asset: cepheus-linux-amd64
            exe_suffix: ""
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            asset: cepheus-linux-arm64
            exe_suffix: ""
          - label: darwin-arm64
            runner: macos-latest
            asset: cepheus-darwin-arm64
            exe_suffix: ""
          - label: windows-amd64
            runner: windows-latest
            asset: cepheus-windows-amd64.exe
            exe_suffix: ".exe"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build deps
        # Nuitka >= 2.4 supports onefile mode reliably across the matrix.
        # patchelf is needed for the Linux onefile bootstrap; setuptools
        # is needed because Nuitka invokes pip during plugin install.
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "nuitka>=2.4,<3.0" ordered-set
          pip install -e .

      - name: Build single-file binary
        # --standalone bundles the Python runtime; --onefile produces a
        # single self-extracting executable. anti-bloat strips unused
        # stdlib modules; lto=yes shaves another ~10% off the binary.
        # We compile cepheus/__main__.py so `cepheus --help` is the
        # entry point — same as `python -m cepheus`.
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          python -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --lto=yes \
            --enable-plugin=anti-bloat \
            --include-package=cepheus \
            --include-package-data=cepheus \
            --output-filename="${ASSET}" \
            --remove-output \
            src/cepheus/__main__.py
          ls -la "${ASSET}"

      - name: Smoke-test the binary
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          # Keep the smoke test minimal — anything that pipes Rich-rendered
          # output through `head` triggers Windows' legacy cp1252 stdout
          # path which can't encode the box-drawing chars. Real OS-level
          # behaviour for piped runs is covered by the v0.4.2 stdout
          # UTF-8 reconfigure in cli.py; the smoke test just needs to
          # confirm the binary loads and dispatches commands.
          ./"${ASSET}" --version
          ./"${ASSET}" --help > /dev/null

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.label }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  container:
    name: build + push GHCR container (multi-arch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Download wheel
        uses: actions/download-artifact@v4
        with: { name: dist, path: dist }

      - uses: docker/setup-qemu-action@v3
        # QEMU enables cross-arch builds on the amd64 runner. Slower
        # than native arm64 but avoids a second runner + image-push
        # coordination.

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          repo=$(echo "${GITHUB_REPOSITORY,,}")  # lowercase per OCI spec
          major_minor="${VERSION%.*}"            # 0.4.1 → 0.4
          {
            echo "repo=${repo}"
            echo "tags=ghcr.io/${repo}:${VERSION},ghcr.io/${repo}:${major_minor},ghcr.io/${repo}:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push (multi-arch)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

  attach-to-release:
    name: attach all assets to GitHub Release
    needs: [build, binaries, container]
    runs-on: ubuntu-latest
    # Only this job needs to write to the repo (to attach release assets).
    # Scoped here rather than at the workflow level so build / publish
    # jobs run without contents:write.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }

      # `binary-*` artifact names from the `binaries` matrix. Download
      # them all into a single staging directory, then sha256sum every
      # file so the release page shows verifiable checksums.
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: binaries/

      - name: Generate SHA-256 checksums
        run: |
          mkdir -p staging
          cp dist/* staging/
          cp binaries/* staging/
          cd staging
          # POSIX sha256sum on Linux; tied to the canonical "256-bit hex
          # then two spaces then filename" format that `sha256sum -c`
          # consumes, so consumers can verify with the standard tool.
          sha256sum * > SHA256SUMS
          echo "=== Release assets ==="
          ls -la
          echo "=== Checksums ==="
          cat SHA256SUMS

      - name: Attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass workflow_dispatch input via env so the expression isn't
          # interpolated into the shell script — defends against tag
          # values that contain shell metacharacters / closing quotes.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Branch on the trigger event explicitly. Under workflow_dispatch,
          # GITHUB_REF is refs/heads/<branch> (not refs/tags/<tag>), so the
          # ${GITHUB_REF#refs/tags/} strip pattern doesn't match and tag
          # ends up as the literal "refs/heads/main" — a tag-shape
          # validation failure downstream. The build job's Capture
          # metadata step uses this same pattern; mirror it here.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          # Defence in depth: validate tag shape before using it. The
          # `tags:` trigger filter already restricts push-driven runs to
          # `v*.*.*`, but workflow_dispatch accepts any string.
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Invalid tag '$tag' — must match v<major>.<minor>.<patch>."
              exit 1
              ;;
          esac
          # Idempotent: if assets already exist (because we ran gh release
          # create with them at ship time), --clobber overwrites instead
          # of failing.
          gh release upload "$tag" staging/* --clobber --repo "${GITHUB_REPOSITORY}"

  update-package-manifests:
    name: update Homebrew formula + Scoop manifest
    needs: [build, attach-to-release]
    runs-on: ubuntu-latest
    # Needs to push a follow-up commit to main with the SHA-256 hashes
    # the binaries job produced — otherwise the placeholder hashes in
    # Formula/cepheus.rb and scoop/cepheus.json would make `brew install`
    # / `scoop install` fail for everyone past this release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Use the workflow's GITHUB_TOKEN. This pushes back to the
          # branch the workflow already has permission on. NB: pushes
          # from a workflow with the default token do NOT trigger other
          # workflows (anti-loop protection), so the follow-up commit
          # won't re-fire this release workflow.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download SHA256SUMS from the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Mirror the build job's event-name branch — GITHUB_REF is
          # refs/heads/<branch> under workflow_dispatch, so a bare strip
          # leaves the wrong value. See attach-to-release for the same
          # rationale.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          gh release download "$tag" \
            --pattern "SHA256SUMS" \
            --output /tmp/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}"
          cat /tmp/SHA256SUMS

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Rewrite Formula/cepheus.rb + scoop/cepheus.json
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Pull per-asset sha256 from the standard sha256sum-format file.
          # Export via $GITHUB_ENV so the python heredoc can read them via
          # os.environ — bash command-substitution-only locals don't survive
          # the python subprocess boundary.
          linux_amd64=$(awk '$2 == "cepheus-linux-amd64"          {print $1}' /tmp/SHA256SUMS)
          linux_arm64=$(awk '$2 == "cepheus-linux-arm64"          {print $1}' /tmp/SHA256SUMS)
          darwin_arm64=$(awk '$2 == "cepheus-darwin-arm64"        {print $1}' /tmp/SHA256SUMS)
          windows_amd64=$(awk '$2 == "cepheus-windows-amd64.exe"  {print $1}' /tmp/SHA256SUMS)

          # Fail loud if any hash is missing — better than silently shipping
          # a half-rewritten formula.
          for h in "$linux_amd64" "$linux_arm64" "$darwin_arm64" "$windows_amd64"; do
            if [ -z "$h" ]; then
              echo "::error::Missing sha256 in SHA256SUMS — refusing to rewrite manifests."
              exit 1
            fi
          done

          # Export to the workflow env for the python heredoc.
          export LINUX_AMD64="$linux_amd64"
          export LINUX_ARM64="$linux_arm64"
          export DARWIN_ARM64="$darwin_arm64"
          export WINDOWS_AMD64="$windows_amd64"

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version       = os.environ["VERSION"]
          linux_amd64   = os.environ["LINUX_AMD64"]
          linux_arm64   = os.environ["LINUX_ARM64"]
          darwin_arm64  = os.environ["DARWIN_ARM64"]
          windows_amd64 = os.environ["WINDOWS_AMD64"]

          # --- Homebrew Formula ---
          formula = Path("Formula/cepheus.rb")
          src = formula.read_text(encoding="utf-8")
          src = re.sub(r'version "[^"]+"', f'version "{version}"', src, count=1)
          src = src.replace("REPLACE_WITH_LINUX_AMD64_SHA256",  linux_amd64)
          src = src.replace("REPLACE_WITH_LINUX_ARM64_SHA256",  linux_arm64)
          src = src.replace("REPLACE_WITH_DARWIN_ARM64_SHA256", darwin_arm64)
          # Re-release case (no placeholders left): rewrite any 64-hex sha
          # adjacent to the recognised platform URLs.
          for arch, sha in [
              ("linux-amd64",  linux_amd64),
              ("linux-arm64",  linux_arm64),
              ("darwin-arm64", darwin_arm64),
          ]:
              src = re.sub(
                  rf'(cepheus-{arch}"\s*\n\s*sha256 ")[a-fA-F0-9]{{64}}"',
                  rf'\g<1>{sha}"',
                  src,
              )
          formula.write_text(src, encoding="utf-8")

          # --- Scoop manifest ---
          scoop_path = Path("scoop/cepheus.json")
          scoop = json.loads(scoop_path.read_text(encoding="utf-8"))
          scoop["version"] = version
          scoop["url"] = (
              f"https://github.com/Su1ph3r/Cepheus/releases/download/v{version}/"
              f"cepheus-windows-amd64.exe"
          )
          scoop["hash"] = windows_amd64
          scoop_path.write_text(json.dumps(scoop, indent=2) + "\n", encoding="utf-8")

          print(f"Updated Formula + Scoop for v{version}.")
          PY

      - name: Commit + push manifest updates
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cepheus.rb scoop/cepheus.json
          if git diff --cached --quiet; then
            echo "No manifest changes — already up to date for v${VERSION}."
            exit 0
          fi
          git commit -m "chore: update Homebrew + Scoop manifests for v${VERSION}"
          git push origin HEAD:main

  publish-pypi:
    name: publish to PyPI
    # Wait for attach-to-release so PyPI (irreversible — no overwrites)
    # only publishes after the GitHub Release assets are durable. The
    # alternative ordering can produce a split-brain release: PyPI live
    # at vX.Y.Z but the GitHub Release has no installable artifacts, with
    # no recovery path except bumping the version.
    needs: [build, attach-to-release]
    runs-on: ubuntu-latest
    # `id-token: write` reserved here for the future migration to PyPI
    # trusted publishing (`pypa/gh-action-pypi-publish`). The current
    # twine path uses a token secret and doesn't need OIDC — kept here
    # so the switch later is a single step replacement.
    permissions:
      contents: read
      id-token: write
    # Skip the whole job when the operator explicitly opts out — useful
    # for forks / mirrors that don't have PyPI credentials configured.
    if: ${{ vars.SKIP_PYPI != 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }

      # Without an explicit setup-python step, this job runs against
      # the runner's system Python (ubuntu-latest's apt-installed
      # python3) — which ships an old ``pkginfo`` that rejects PEP 639
      # metadata fields (``License-Expression``, ``License-File``)
      # that modern hatchling emits when pyproject.toml uses the
      # SPDX string form ``license = "MIT"``. Pin a known-good Python
      # so the next twine/pkginfo upgrade lands in a clean install
      # instead of fighting apt's user-site-packages layout.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish via twine
        # Twine is the safest option until trusted publishing is set up
        # — explicit token, clear failure mode. To migrate later: switch
        # this step to `pypa/gh-action-pypi-publish@release/v1` and remove
        # the secrets/twine block.
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${TWINE_PASSWORD}" ]; then
            # FAIL loudly — earlier versions exited 0 here, which made
            # tag pushes appear green while silently no-op-ing the
            # publish. A green release with PyPI still at the old version
            # is the worst-of-both-worlds outcome; opt-out is via the
            # repo-level SKIP_PYPI variable (see job `if:` above).
            echo "::error::PYPI_API_TOKEN secret is not set."
            echo "Configure it under Settings → Secrets and variables → Actions,"
            echo "or set the repository variable SKIP_PYPI=true to disable PyPI publishing for this repo."
            exit 1
          fi
          # Explicit pkginfo upgrade: twine pulls pkginfo transitively,
          # but pinning it to a version with PEP 639 awareness (>=1.12)
          # avoids "Invalid distribution metadata: unrecognized or
          # malformed field 'license-expression'" failures from
          # ``twine check`` against modern wheel metadata.
          python -m pip install --upgrade pip
          python -m pip install --upgrade "twine>=6.0" "pkginfo>=1.12"
          twine check dist/*
          twine upload dist/*
