apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cepheus-admission.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cepheus-admission.labels" . | nindent 4 }}
# The admission server doesn't currently need K8s API access — it
# operates entirely on the AdmissionReview payload kube-apiserver
# hands it. The ServiceAccount exists so future enhancements (Node
# kernel version lookup, RBAC-based per-namespace policy) can attach
# narrowly-scoped permissions without redeploying.
automountServiceAccountToken: false
