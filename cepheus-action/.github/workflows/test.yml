name: action self-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan-busybox:
    name: scan-busybox-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull a small public image
        run: docker pull busybox:latest

      - name: Run Cepheus
        uses: ./
        with:
          image: busybox:latest
          # No max-severity here — busybox is unprivileged-by-default and
          # should produce no critical chains. Verify the action works
          # end-to-end without making the gate dependent on technique-db
          # changes upstream.
          upload-sarif: "false"   # avoid Code Scanning quota for a self-test

      - name: Confirm SARIF written
        run: |
          test -f cepheus.sarif
          python -c "import json,sys; d = json.load(open('cepheus.sarif')); print('chains:', len(d['runs'][0].get('results', [])))"
